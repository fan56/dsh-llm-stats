name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install global dsh closure
        # Rolling @alpha dist-tag: the line this plugin targets; `latest`
        # still points at the dropped rc line.
        run: npm install -g @deepseek-ai/dsh@alpha

      - name: Link dsh closure types
        run: node scripts/link-dsh-closure.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Gate the release on the same checks CI runs per push.
      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Stamp package.json to the tag version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
